<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emon Image Gallery</title>
    <style>
        /* লাইট ও ডার্ক মোডের জন্য বেসিক স্টাইল */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            color: #000;
            transition: background 0.3s, color 0.3s;
        }
        h1 {
            margin-top: 20px;
        }
        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .image-container {
            width: 250px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s, background 0.3s;
        }
        .image-container:hover {
            transform: scale(1.05);
        }
        .image-container img {
            width: 100%;
            border-radius: 10px;
        }
        .image-container .timestamp {
            margin-top: 8px;
            font-size: 14px;
            color: gray;
        }

        /* ডার্ক মোড স্টাইল */
        body.dark-mode {
            background-color: #121212;
            color: #fff;
        }
        .dark-mode .image-container {
            background: #1e1e1e;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.2);
        }
        .dark-mode .timestamp {
            color: #ccc;
        }

        /* ডার্ক মোড বাটন */
        .toggle-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            transition: background 0.3s;
        }
        .toggle-button:hover {
            background-color: #555;
        }
        .dark-mode .toggle-button {
            background-color: #fff;
            color: #000;
        }
        .dark-mode .toggle-button:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <h1>Emon Image Gallery</h1>
    <button class="toggle-button" onclick="toggleDarkMode()">Toggle Dark Mode</button>

    <div class="gallery" id="imageGallery"></div>

    <script>
        // ডার্ক মোড টগল ফাংশন
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        // ইমেজ লিস্ট (GitHub Raw URL ব্যবহার করো)
        const images = [
            { url: "https://raw.githubusercontent.com/Termux-Emon/g/refs/heads/main/images/PXL_20250209_005916200.PORTRAIT.ORIGINAL.jpg", date: "2024-02-12 10:30 AM" },
            { url: "https://raw.githubusercontent.com/Termux-Emon/g/refs/heads/main/images/20241204_185001.jpg", date: "2024-02-12 11:15 AM" },
            { url: "https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/images/image3.jpg", date: "2024-02-12 12:45 PM" }
        ];

        const gallery = document.getElementById("imageGallery");

        images.forEach(image => {
            const container = document.createElement("div");
            container.classList.add("image-container");

            const imgElement = document.createElement("img");
            imgElement.src = image.url;
            imgElement.alt = "Gallery Image";

            const timestamp = document.createElement("div");
            timestamp.classList.add("timestamp");
            timestamp.textContent = "Uploaded: " + image.date;

            container.appendChild(imgElement);
            container.appendChild(timestamp);
            gallery.appendChild(container);
        });
    </script>

</body>
</html>
